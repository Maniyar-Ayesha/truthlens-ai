apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: truthlens-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: truthlens-frontend
  template:
    metadata:
      labels:
        app: truthlens-frontend
    spec:
      containers:
        - name: frontend
          image: esha0ay/truthlens-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
