apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: truthlens-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: truthlens-backend
  template:
    metadata:
      labels:
        app: truthlens-backend
    spec:
      containers:
        - name: backend
          image: maniyar123/truthlens-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
